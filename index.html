<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vireonix AI Test</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;background:#0f1117;color:#f5f7fb;display:flex;justify-content:center}.app{width:min(900px,100%);min-height:100vh;display:flex;flex-direction:column}header{padding:20px;border-bottom:1px solid #292d38}h1{margin:0;font-size:20px}header p{margin:5px 0 0;color:#9da5b4;font-size:13px}#chat{flex:1;padding:24px 20px;overflow-y:auto}.message{max-width:80%;padding:12px 15px;margin:0 0 14px;border-radius:14px;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}.user{margin-left:auto;background:#315efb}.assistant{margin-right:auto;background:#1b1f29;border:1px solid #292d38}.error{background:#4a1f24;border-color:#74323a}form{display:flex;gap:10px;padding:16px 20px 20px;border-top:1px solid #292d38}textarea{flex:1;resize:none;min-height:48px;padding:13px;border:1px solid #363c49;border-radius:12px;background:#171a22;color:#fff;font:inherit;outline:none}button{height:48px;padding:0 20px;border:0;border-radius:12px;background:#315efb;color:#fff;font-weight:600;cursor:pointer}button:disabled{opacity:.5}
</style>
</head>
<body><main class="app">
<header><h1>Vireonix AI Test</h1><p>Vireonix via Supabase · no API key</p></header>
<section id="chat" aria-live="polite"></section>
<form id="form"><textarea id="message" placeholder="Message the AI..." aria-label="Message" required></textarea><button id="send">Send</button></form>
</main>
<script>
const SUPABASE_FUNCTION="https://amquosuyqcyyinjhvuow.supabase.co/functions/v1/vireonix-chat";
const chat=document.getElementById("chat"),form=document.getElementById("form"),input=document.getElementById("message"),send=document.getElementById("send"),messages=[];
function add(role,text,cls=""){const el=document.createElement("div");el.className="message "+role+(cls?" "+cls:"");el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el}
form.addEventListener("submit",async e=>{
e.preventDefault();const text=input.value.trim();if(!text||send.disabled)return;
messages.push({role:"user",content:text});add("user",text);input.value="";send.disabled=true;const pending=add("assistant","Thinking...");
try{
const response=await fetch(SUPABASE_FUNCTION,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({messages})});
const raw=await response.text();let data;
try{data=JSON.parse(raw)}catch{throw new Error("Backend returned invalid JSON (HTTP "+response.status+").")}
if(!response.ok)throw new Error(data?.error?.message||"Backend HTTP "+response.status);
const answer=data?.choices?.[0]?.message?.content;
if(!answer)throw new Error("No response text returned.");
pending.textContent=answer;messages.push({role:"assistant",content:answer});
}catch(err){pending.textContent="Error: "+(err?.message||String(err));pending.classList.add("error");}
finally{send.disabled=false;input.focus()}
});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
</script></body></html>
