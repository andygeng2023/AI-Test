<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vireonix AI Test</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
<header>
  <h1>Coli</h1>
  <p>A free AI chatbot</p>
</header>
<section id="chat" aria-live="polite"></section>
<form id="form">
  <div class="composer">
    <textarea id="message" placeholder="Message Coli..." aria-label="Message" required></textarea>
    <button id="send" type="submit" aria-label="Send message" title="Send message">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13"></path><path d="m22 2-7 20-4-9-9-4Z"></path></svg>
    </button>
  </div>
</form>
</main>
<script>
const setViewportHeight=()=>{
  const viewport=window.visualViewport;
  const height=viewport?.height||window.innerHeight;
  const top=viewport?.offsetTop||0;
  document.documentElement.style.setProperty("--app-height",height+"px");
  document.documentElement.style.setProperty("--app-top",top+"px");
};
setViewportHeight();
window.addEventListener("resize",setViewportHeight,{passive:true});
window.visualViewport?.addEventListener("resize",setViewportHeight,{passive:true});
window.visualViewport?.addEventListener("scroll",setViewportHeight,{passive:true});

const SUPABASE_FUNCTION="https://amquosuyqcyyinjhvuow.supabase.co/functions/v1/vireonix-chat";
const chat=document.getElementById("chat"),form=document.getElementById("form"),input=document.getElementById("message"),send=document.getElementById("send"),messages=[];

function escapeHtml(text){
  return text.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
}

function formatInline(text){
  return escapeHtml(text)
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/__(.+?)__/g,"<strong>$1</strong>")
    .replace(/\*([^*\n]+)\*/g,"<em>$1</em>")
    .replace(/_([^_\n]+)_/g,"<em>$1</em>");
}

function renderMarkdown(text){
  const fragment=document.createDocumentFragment();
  let list=null;
  for(const line of text.split("\n")){
    const match=line.match(/^\s*[-*]\s+(.+)$/);
    if(match){
      if(!list){list=document.createElement("ul");fragment.appendChild(list)}
      const li=document.createElement("li");
      li.innerHTML=formatInline(match[1]);
      list.appendChild(li);
    }else{
      list=null;
      const p=document.createElement("p");
      p.innerHTML=formatInline(line);
      fragment.appendChild(p);
    }
  }
  return fragment;
}

function setMessageContent(el,text){
  el.replaceChildren(renderMarkdown(text));
}

function add(role,text,cls=""){
  const el=document.createElement("div");
  el.className="message "+role+(cls?" "+cls:"");
  setMessageContent(el,text);
  chat.appendChild(el);
  chat.scrollTop=chat.scrollHeight;
  return el;
}

form.addEventListener("submit",async e=>{
  e.preventDefault();
  const text=input.value.trim();
  if(!text||send.disabled)return;
  messages.push({role:"user",content:text});
  add("user",text);
  input.value="";
  send.disabled=true;
  const pending=add("assistant","");

  try{
    const response=await fetch(SUPABASE_FUNCTION,{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"text/event-stream, application/json"},
      body:JSON.stringify({messages})
    });

    if(!response.ok){
      const raw=await response.text();
      let data;
      try{data=JSON.parse(raw)}catch{}
      throw new Error(data?.error?.message||"Backend HTTP "+response.status);
    }

    const contentType=response.headers.get("content-type")||"";
    if(!response.body||!contentType.includes("text/event-stream")){
      const data=await response.json();
      const answer=data?.choices?.[0]?.message?.content;
      if(!answer)throw new Error("No response text returned.");
      setMessageContent(pending,answer);
      messages.push({role:"assistant",content:answer});
      return;
    }

    const reader=response.body.getReader();
    const decoder=new TextDecoder();
    let buffer="",answer="";

    while(true){
      const {value,done}=await reader.read();
      if(done)break;
      buffer+=decoder.decode(value,{stream:true});
      const events=buffer.split("\n\n");
      buffer=events.pop()||"";

      for(const event of events){
        for(const line of event.split("\n")){
          if(!line.startsWith("data:"))continue;
          const payload=line.slice(5).trim();
          if(!payload||payload==="[DONE]")continue;
          try{
            const data=JSON.parse(payload);
            const delta=data?.choices?.[0]?.delta?.content||"";
            if(delta){
              answer+=delta;
              setMessageContent(pending,answer);
              chat.scrollTop=chat.scrollHeight;
            }
          }catch{}
        }
      }
    }

    if(!answer)throw new Error("No streamed response text returned.");
    messages.push({role:"assistant",content:answer});
  }catch(err){
    setMessageContent(pending,"Error: "+(err?.message||String(err)));
    pending.classList.add("error");
  }finally{
    send.disabled=false;
    input.focus();
  }
});

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    form.requestSubmit();
  }
});
</script>
</body>
</html>
