<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vireonix AI Test</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
<header>
  <h1>Coli</h1>
  <p>A free AI chatbot</p>
</header>
<section id="chat" aria-live="polite"></section>
<form id="form">
  <div class="composer">
    <textarea id="message" placeholder="Message Coli..." aria-label="Message" required></textarea>
    <button id="send" type="submit" aria-label="Send message" title="Send message">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13"></path><path d="m22 2-7 20-4-9-9-4Z"></path></svg>
    </button>
  </div>
</form>
</main>
<script>
const SUPABASE_FUNCTION="https://amquosuyqcyyinjhvuow.supabase.co/functions/v1/vireonix-chat";
const chat=document.getElementById("chat"),form=document.getElementById("form"),input=document.getElementById("message"),send=document.getElementById("send"),messages=[];
function add(role,text,cls=""){const el=document.createElement("div");el.className="message "+role+(cls?" "+cls:"");el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el}
form.addEventListener("submit",async e=>{
e.preventDefault();const text=input.value.trim();if(!text||send.disabled)return;
messages.push({role:"user",content:text});add("user",text);input.value="";send.disabled=true;const pending=add("assistant","Thinking...");
try{
const response=await fetch(SUPABASE_FUNCTION,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({messages})});
const raw=await response.text();let data;
try{data=JSON.parse(raw)}catch{throw new Error("Backend returned invalid JSON (HTTP "+response.status+").")}
if(!response.ok)throw new Error(data?.error?.message||"Backend HTTP "+response.status);
const answer=data?.choices?.[0]?.message?.content;
if(!answer)throw new Error("No response text returned.");
pending.textContent=answer;messages.push({role:"assistant",content:answer});
}catch(err){pending.textContent="Error: "+(err?.message||String(err));pending.classList.add("error");}
finally{send.disabled=false;input.focus()}
});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
</script>
</body>
</html>
